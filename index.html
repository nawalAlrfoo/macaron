<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>ماكرون</title>
    <meta
      name="description"
      content="ماكرون — مجتمع للتعلم والأسئلة: غرف للبرمجة والدراسة والمشاريع، ومحادثات خاصة بطلب، بالعربي والإنجليزي."
    />
    <meta name="author" content="Nawal Alrfoo" />
    <meta name="theme-color" content="#F7F7FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11131E" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Icons -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ماكرون" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ماكرون" />
    <meta property="og:title" content="ماكرون — اسأل، تعلّم، وساعد غيرك" />
    <meta
      property="og:description"
      content="غرف للأسئلة والبرمجة والدراسة والمشاريع، بالعربي والإنجليزي."
    />
    <meta property="og:image" content="https://macaron.nawal.pro/og-image.jpg" />
    <meta property="og:url" content="https://macaron.nawal.pro/" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_JO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ماكرون — اسأل، تعلّم، وساعد غيرك" />
    <meta name="twitter:image" content="https://macaron.nawal.pro/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Instant splash before React loads */
      html, body { background: #F7F7FA; }
      @media (prefers-color-scheme: dark) { html, body { background: #11131E; } }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot img { width: 64px; height: 64px; animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><img src="favicon.svg" alt="ماكرون" /></div></div>
    <noscript>يحتاج ماكرون إلى تفعيل JavaScript في المتصفح.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
